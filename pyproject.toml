[project]
name = "bifrost-sdk"
version = "0.4.0"
description = "An OpenAI-compatible async client, with Bifrost extras."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Auth strategies beyond a bearer key, each imported only when it is built (bifrost_sdk.auth).
google = ["google-auth[requests]>=2.30"]
aws = ["botocore>=1.34"]
dev = ["mcp>=2.2", "pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bifrost_sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL", "RUF", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The live tests register MCP clients and virtual keys on whatever gateway LLM_BASE_URL names,
# and that variable is set in shells that never meant to: they run only when asked for, with
# `-m live` (a later -m replaces this one).
addopts = ["-m", "not live"]
markers = ["live: needs a running gateway (LLM_BASE_URL) or a provider key; run with -m live"]

[tool.ruff.lint.per-file-ignores]
# PLR0913: the three verbs take many *keyword-only* arguments on purpose — that is the
# ergonomic shape for a client API, and collapsing them into an options object would make
# the common call harder to write, not easier.
# admin/skills.py: a skill version is published as one call with its fields named, the same way.
"src/bifrost_sdk/_client.py" = ["PLR0913"]
"src/bifrost_sdk/admin/skills.py" = ["PLR0913"]
# PLR2004: a test's expected value is a literal on purpose — naming it hides what is asserted.
"tests/**" = ["PLR2004"]
