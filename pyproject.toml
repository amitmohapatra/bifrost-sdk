[project]
name = "bifrost-sdk"
version = "0.1.0"
description = "A small client for a Bifrost LLM gateway."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bifrost_sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL", "RUF", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# PLR0913: the three verbs take many *keyword-only* arguments on purpose — that is the
# ergonomic shape for a client API, and collapsing them into an options object would make
# the common call harder to write, not easier.
"src/bifrost_sdk/_client.py" = ["PLR0913"]
# PLR2004: a test's expected value is a literal on purpose — naming it hides what is asserted.
"tests/**" = ["PLR2004"]
